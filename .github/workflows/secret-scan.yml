name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for delta scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan changes only (push diff or PR diff)
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "[gitleaks] no base SHA; scanning HEAD commit"
            gitleaks detect --redact --verbose --no-banner --exit-code 1 \
              --log-opts="-1 HEAD"
          else
            echo "[gitleaks] scanning diff $BASE_SHA..$HEAD_SHA"
            gitleaks detect --redact --verbose --no-banner --exit-code 1 \
              --log-opts="$BASE_SHA..$HEAD_SHA"
          fi